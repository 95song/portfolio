<script>
document.addEventListener('DOMContentLoaded', () => {
  const follower = document.querySelector('.cursor-follower');

  // 목표 위치 (실제 마우스 좌표)
  let targetX = 0;
  let targetY = 0;

  // 현재 동그라미의 위치
  let currentX = 0;
  let currentY = 0;

  // 마우스 이동 시 목표 좌표만 업데이트
  window.addEventListener('mousemove', (e) => {
    targetX = e.clientX;
    targetY = e.clientY;
  });

  // 부드럽게 추적하는 애니메이션 함수
  function render() {
    // 0.1(10%) 비율만큼 매 프레임마다 목표 지점으로 부드럽게 이동
    // 숫자가 작을수록(예: 0.05) 더 천천히/뒤늦게 따라오고, 크면(예: 0.2) 빠르게 따라옵니다.
    const speed = 0.1;

    currentX += (targetX - currentX) * speed;
    currentY += (targetY - currentY) * speed;

    follower.style.left = `${currentX}px`;
    follower.style.top = `${currentY}px`;

    // 다음 프레임 요청 (무한 루프)
    requestAnimationFrame(render);
  }

  // 애니메이션 시작
  render();
});
</script>

        <script>
		
            document.addEventListener('DOMContentLoaded', function () {
                const accordionToggles = document.querySelectorAll('.sitemap_dep1 > a');

                accordionToggles.forEach(toggle => {
                    toggle.addEventListener('click', function () {
                        const parentItem = this.parentElement;
                        
                        // 이미 열려 있는 다른 아코디언 메뉴 닫기
                        document.querySelectorAll('.sitemap_dep1').forEach(item => {
                            if (item !== parentItem) {
                                item.classList.remove('active');
                            }
                        });

                        // 클릭한 항목 토글
                        parentItem.classList.toggle('active');
                    });
                });
            });
